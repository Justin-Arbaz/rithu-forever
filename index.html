<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Will You Be Mine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --peach1:#ffd9ce;--peach2:#ffb9a8;--card:#fff8f5;
    --rose:#ff6f81;--rose-dark:#e34f66;--ink:#4a3236;--sub:#8a6a6e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:linear-gradient(160deg,var(--peach1),var(--peach2));
    font-family:'Poppins',sans-serif;color:var(--ink);overflow-x:hidden;
  }

  /* curtain */
  #curtain{position:fixed;inset:0;z-index:200;display:flex;cursor:pointer;}
  .c-half{
    width:50%;height:100%;
    background:linear-gradient(180deg,#e34f66 0%,#ff6f81 100%);
    transition:transform 1s cubic-bezier(.77,0,.18,1);
    will-change:transform;
  }
  #curtain.open .c-half.left { transform:translateX(-100%); }
  #curtain.open .c-half.right{ transform:translateX(100%);  }
  #curtain.gone{ display:none; }
  #curtain-label{
    position:fixed;inset:0;z-index:201;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;gap:18px;
  }
  .cl-heart{font-size:52px;animation:hbeat 1.1s ease-in-out infinite;}
  .cl-title{
    font-family:'Caveat',cursive;font-weight:700;font-size:54px;
    color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.2);
    animation:hbeat 1.1s ease-in-out infinite;
  }
  .cl-sub{font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.04em;}
  @keyframes hbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  #curtain-label.gone{display:none;}

  /* floating hearts */
  #heartfall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
  .bgheart{position:absolute;top:-40px;font-size:20px;opacity:.5;animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(115vh) rotate(25deg);}}

  /* stage & card */
  .stage{
    position:relative;z-index:2;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:28px 18px;
  }
  .card{
    width:100%;max-width:380px;background:var(--card);border-radius:32px;
    padding:32px 28px 36px;text-align:center;
    box-shadow:0 20px 50px rgba(180,90,90,.28),0 0 0 1px rgba(255,180,170,.3);
    animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn{from{opacity:0;transform:scale(.88) translateY(18px);}to{opacity:1;transform:none;}}

  .art{
    width:190px;height:170px;margin:0 auto 22px;
    border-radius:22px;overflow:hidden;
    box-shadow:0 10px 28px rgba(227,79,102,.25);
    border:3px solid rgba(255,111,129,.28);background:#ffe3d6;
  }
  .art img{width:100%;height:100%;object-fit:cover;display:block;}

  .title{
    font-family:'Caveat',cursive;font-weight:700;font-size:42px;
    color:var(--rose-dark);line-height:1.1;margin:0 0 10px;
    text-shadow:0 2px 8px rgba(227,79,102,.15);
  }
  .subtitle{
    font-size:15px;color:var(--sub);line-height:1.65;
    margin:0 0 26px;font-style:italic;
  }

  .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  button{
    font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;
    padding:14px 28px;border-radius:999px;border:none;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .yes-btn{
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    color:#fff;box-shadow:0 8px 20px rgba(227,79,102,.4);
  }
  .yes-btn:hover{transform:translateY(-2px) scale(1.04);}
  .yes-btn:active{transform:scale(.97);}
  .no-btn{background:#fff;color:var(--ink);border:1.5px solid #eccfce;}
  .no-btn:hover{transform:translateY(-2px);border-color:#e0adac;}
  .next-btn{
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    color:#fff;box-shadow:0 8px 20px rgba(227,79,102,.4);
  }
  .next-btn:hover{transform:translateY(-2px);}

  .progress{display:flex;gap:6px;justify-content:center;margin-top:22px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#f0d4d2;transition:background .3s;}
  .dot.active{background:var(--rose);}

  /* music pill */
  #musicBtn{
    position:fixed;bottom:20px;right:20px;z-index:300;
    background:rgba(255,255,255,.88);
    border:1.5px solid rgba(255,111,129,.35);
    border-radius:999px;padding:9px 16px 9px 12px;
    font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;
    color:var(--rose-dark);cursor:pointer;
    box-shadow:0 4px 16px rgba(227,79,102,.18);
    display:none;align-items:center;gap:7px;
    backdrop-filter:blur(8px);
    transition:transform .15s,box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #musicBtn.visible{display:flex;}
  #musicBtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(227,79,102,.28);}
  #musicBtn:active{transform:scale(.96);}
  #musicBtn .note{font-size:17px;animation:noteBounce 1.4s ease-in-out infinite;}
  @keyframes noteBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  #musicBtn.muted .note{animation:none;}

  .confetti-piece{position:fixed;top:-20px;z-index:5;pointer-events:none;border-radius:2px;}

  @media(prefers-reduced-motion:reduce){
    .bgheart,.confetti-piece,.note,.cl-heart,.cl-title{animation:none!important;}
    .card{animation:none;}
  }
</style>
</head>
<body>

<div id="curtain">
  <div class="c-half left"></div>
  <div class="c-half right"></div>
</div>
<div id="curtain-label">
  <div class="cl-heart">💖</div>
  <div class="cl-title">For You 🌸</div>
  <div class="cl-sub">tap to open…</div>
</div>

<audio id="bgMusic" loop playsinline autoplay>
  <source src="music/background.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" title="Toggle music">
  <span class="note">🎵</span><span id="musicLabel">Play music</span>
</button>

<div id="heartfall"></div>
<div class="stage"><div class="card" id="card"></div></div>

<script>
(function(){

  /* ── JSONBIN CONFIG ── */
  var BIN_ID  = "6a816b73da38895dfeea93d5";
  var API_KEY = "$2a$10$NgAk3TXUYzO4/JqyTiPgaOTL1OrcnqFz6ZURzIn92R1R/ww/9nE7.";
  /* ─────────────────── */

  var audio        = document.getElementById('bgMusic');
  var musicBtn     = document.getElementById('musicBtn');
  var musicLabel   = document.getElementById('musicLabel');
  var curtain      = document.getElementById('curtain');
  var curtainLabel = document.getElementById('curtain-label');
  var revealed     = false;
  var userMuted    = false;   // true only when SHE tapped mute
  var started      = false;   // true once audio has played at least once

  audio.volume = 0.35;

  /* ── curtain ── */
  function openCurtain(){
    if(revealed) return;
    revealed = true;
    curtain.classList.add('open');
    curtainLabel.classList.add('gone');
    setTimeout(function(){ curtain.classList.add('gone'); }, 1050);

    // try autoplay — works on desktop, may be blocked on mobile
    audio.play().then(function(){
      started = true;
      syncPill();
    }).catch(function(){
      // blocked (mobile) — show pill so she taps it
      syncPill();
    });

    musicBtn.classList.add('visible');
  }

  curtain.addEventListener('click',      openCurtain);
  curtain.addEventListener('touchstart', openCurtain, {passive:true});

  /* ── tab visibility: pause when hidden, resume when back ── */
  document.addEventListener('visibilitychange', function(){
    if(!started || userMuted) return;
    if(document.hidden){
      audio.pause();
    } else {
      audio.play().catch(function(){});
    }
  });

  /* ── music pill ── */
  function syncPill(){
    var playing = !audio.paused;
    musicBtn.classList.toggle('muted', !playing);
    musicLabel.textContent = playing ? 'Music on' : 'Play music';
    musicBtn.querySelector('.note').textContent = playing ? '🎵' : '🔇';
  }

  musicBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(!started || audio.paused){
      // first tap on mobile OR resuming after mute
      audio.play().then(function(){
        started    = true;
        userMuted  = false;
        syncPill();
      }).catch(function(){});
    } else {
      audio.pause();
      userMuted = true;
      syncPill();
    }
  });

  /* ── content ── */
  var card = document.getElementById('card');
  var idx  = 0;

  var ASK = {
    title: "Will you be mine? 💌",
    sub:   "Every love story is beautiful… but ours could be my favorite.",
    gif:   "gif/be-mine-gf.gif"
  };
  var YES_SERIES = [
    { title:"YESSS!! 🎉🎉",     sub:"I literally jumped! You just made me the happiest person alive!", gif:"gif/yes/yess-yes.gif" },
    { title:"We're so us 😎💕", sub:"Cool, fun, a little chaotic — and totally perfect together.",     gif:"gif/yes/cool-fun.gif" }
  ];
  var YES_FINAL = {
    title: "I love you so much 🥰",
    sub:   "Every single day with you feels like a dream I never want to wake up from.",
    gif:   "gif/yes/love-you.gif"
  };
  var NO_SERIES = [
    { title:"Nooo… 🍑😢",       sub:"My little heart is soft and it's breaking right now… please reconsider?", gif:"gif/mochi-peach.gif"     },
    { title:"Watchu mean?? 😤", sub:"I'm sorry — I don't think I heard that correctly. Try again? 👀",          gif:"gif/watchu-mean-huh.gif" }
  ];
  var NO_FINAL = {
    title: "Alright, alright… fine. 😤",
    sub:   "I'll give you ONE more chance. Choose wisely this time. 👇",
    gif:   "gif/alright-alright-fine.gif"
  };

  function saveAnswer(ans){
    fetch("https://api.jsonbin.io/v3/b/" + BIN_ID, {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
      body:JSON.stringify({ answer:ans, timestamp:new Date().toISOString() })
    }).catch(function(){});
  }

  function img(src){ return '<div class="art"><img src="'+src+'" alt=""></div>'; }
  function dots(cur,total){
    var h='<div class="progress">';
    for(var i=0;i<total;i++) h+='<div class="dot'+(i===cur?' active':'')+'"></div>';
    return h+'</div>';
  }

  function renderAsk(){
    card.innerHTML =
      img(ASK.gif)+
      '<h1 class="title">'+ASK.title+'</h1>'+
      '<p class="subtitle">'+ASK.sub+'</p>'+
      '<div class="btn-row">'+
        '<button class="yes-btn" id="yBtn">Yes! 💖</button>'+
        '<button class="no-btn" id="nBtn">No</button>'+
      '</div>';
    document.getElementById('yBtn').onclick = function(){ saveAnswer('yes'); idx=0; renderYesStep(); };
    document.getElementById('nBtn').onclick = function(){ saveAnswer('no');  idx=0; renderNoStep();  };
  }

  function renderYesStep(){
    var total=YES_SERIES.length, last=idx>=total-1, s=YES_SERIES[idx];
    card.innerHTML =
      img(s.gif)+
      '<h1 class="title">'+s.title+'</h1>'+
      '<p class="subtitle">'+s.sub+'</p>'+
      '<div class="btn-row"><button class="next-btn" id="nx">'+(last?'See the finale ✨':'Next →')+'</button></div>'+
      dots(idx,total);
    document.getElementById('nx').onclick = function(){ last ? renderYesFinal() : (idx++, renderYesStep()); };
  }

  function renderYesFinal(){
    card.innerHTML =
      img(YES_FINAL.gif)+
      '<h1 class="title">'+YES_FINAL.title+'</h1>'+
      '<p class="subtitle">'+YES_FINAL.sub+'</p>';
    burstConfetti();
  }

  function renderNoStep(){
    var total=NO_SERIES.length, last=idx>=total-1, s=NO_SERIES[idx];
    card.innerHTML =
      img(s.gif)+
      '<h1 class="title">'+s.title+'</h1>'+
      '<p class="subtitle">'+s.sub+'</p>'+
      '<div class="btn-row"><button class="next-btn" id="nx">'+(last?'One more thing →':'Next →')+'</button></div>'+
      dots(idx,total);
    document.getElementById('nx').onclick = function(){ last ? renderNoFinal() : (idx++, renderNoStep()); };
  }

  function renderNoFinal(){
    card.innerHTML =
      img(NO_FINAL.gif)+
      '<h1 class="title">'+NO_FINAL.title+'</h1>'+
      '<p class="subtitle">'+NO_FINAL.sub+'</p>'+
      '<div class="btn-row">'+
        '<button class="yes-btn" id="y2">Yes! 💖</button>'+
        '<button class="no-btn" id="n2">No, really</button>'+
      '</div>';
    document.getElementById('y2').onclick = function(){ saveAnswer('yes'); idx=0; renderYesStep(); };
    document.getElementById('n2').onclick = function(){ renderAsk(); };
  }

  function burstConfetti(){
    var colors=['#ff6f81','#ffb9a8','#ffd9ce','#5b8def','#ffe066'];
    for(var i=0;i<70;i++){
      (function(){
        var el=document.createElement('div');
        el.className='confetti-piece';
        var sz=6+Math.random()*7;
        el.style.cssText='width:'+sz+'px;height:'+(sz*.4)+'px;background:'+colors[Math.floor(Math.random()*5)]+';left:'+(Math.random()*100)+'vw;';
        var dur=2.2+Math.random()*1.6, rot=Math.random()*360;
        el.style.transform='rotate('+rot+'deg)';
        el.style.transition='transform '+dur+'s ease-in,top '+dur+'s ease-in,opacity '+dur+'s';
        document.body.appendChild(el);
        requestAnimationFrame(function(){
          el.style.top=(100+Math.random()*10)+'vh';
          el.style.transform='rotate('+(rot+360)+'deg)';
          el.style.opacity='.1';
        });
        setTimeout(function(){el.remove();},dur*1000+200);
      })();
    }
  }

  function seedHearts(){
    var layer=document.getElementById('heartfall');
    var h=['💕','🤍','❤️','💖','🌸'];
    for(var i=0;i<16;i++){
      var s=document.createElement('span');
      s.className='bgheart';
      s.textContent=h[Math.floor(Math.random()*h.length)];
      s.style.left=(Math.random()*100)+'vw';
      s.style.animationDuration=(9+Math.random()*8)+'s';
      s.style.animationDelay=(Math.random()*12)+'s';
      s.style.fontSize=(13+Math.random()*14)+'px';
      layer.appendChild(s);
    }
  }

  seedHearts();
  renderAsk();
})();
</script>
</body>
</html>
